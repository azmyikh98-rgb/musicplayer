<script>
/* Pilih layout sebelum render supaya tidak berkedip: phone | tablet | desktop (+ class tv) */
(function () {
  try {
    var d = document.documentElement, q = new URLSearchParams(location.search).get('tv'), s = localStorage.getItem('tv');
    var uaTV = /SMART-?TV|Tizen|Web0S|WebOS|NetCast|HbbTV|BRAVIA|AFTT|AFTM|GoogleTV|Android.*TV|CrKey|Roku|VIDAA/i.test(navigator.userAgent);
    var tv = q === '1' || (q !== '0' && (s === 'true' || (s === null && uaTV)));
    var w = window.innerWidth;
    d.dataset.layout = tv || w >= 1200 ? 'desktop' : w >= 768 ? 'tablet' : 'phone';
    if (tv) d.classList.add('tv');
  } catch (e) {}
})();
</script>

<style id="splash-css">
html.nosplash #splash{display:none}
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;background:#0e0e13;overflow:hidden;transition:opacity .5s ease,transform .5s ease;color:#f3f3f7;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
#splash .glow{position:absolute;width:140vmax;height:140vmax;left:50%;top:42%;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(255,79,109,.22),rgba(255,154,86,.08) 45%,transparent 70%);animation:sp-breathe 3.2s ease-in-out infinite}
#splash .mark{position:relative;width:7rem;height:7rem;display:grid;place-items:center;animation:sp-pop .7s cubic-bezier(.2,1.3,.4,1) both}
#splash .mark svg{position:relative;width:100%;height:100%;filter:drop-shadow(0 .75rem 2rem rgba(255,79,109,.45))}
#splash .ring{position:absolute;inset:0;border-radius:50%;border:.125rem solid rgba(255,107,100,.55);opacity:0;animation:sp-ring 2.4s ease-out infinite}
#splash .ring:nth-child(2){animation-delay:.8s}
#splash .ring:nth-child(3){animation-delay:1.6s}
#splash h1{margin:0;font-size:2.25rem;font-weight:800;letter-spacing:-.02em;background:linear-gradient(135deg,#ff4f6d,#ff9a56);-webkit-background-clip:text;background-clip:text;color:transparent;animation:sp-up .6s .25s ease both}
#splash p{margin:-1rem 0 0;font-size:.9375rem;color:#9a9aad;animation:sp-up .6s .45s ease both}
#splash .eq{display:flex;align-items:flex-end;gap:.25rem;height:1.25rem;margin-top:.75rem;animation:sp-up .6s .6s ease both}
#splash .eq i{display:block;width:.25rem;height:100%;border-radius:.125rem;background:linear-gradient(#ff4f6d,#ff9a56);transform-origin:bottom;animation:sp-eq 1s ease-in-out infinite}
#splash .eq i:nth-child(2){animation-delay:.15s}#splash .eq i:nth-child(3){animation-delay:.3s}#splash .eq i:nth-child(4){animation-delay:.45s}#splash .eq i:nth-child(5){animation-delay:.6s}
@keyframes sp-pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes sp-up{from{opacity:0;transform:translateY(.75rem)}to{opacity:1;transform:none}}
@keyframes sp-ring{0%{opacity:.7;transform:scale(.95)}100%{opacity:0;transform:scale(2.3)}}
@keyframes sp-eq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
@keyframes sp-breathe{0%,100%{opacity:.75}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){#splash *{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>

<body>
<div id="splash" role="status" aria-label="Memuat Nada">
  <div class="glow"></div>
  <div class="mark"><i class="ring"></i><i class="ring"></i><i class="ring"></i>
    <svg viewBox="0 0 512 512" aria-hidden="true"><defs><linearGradient id="spg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff4f6d"/><stop offset="1" stop-color="#ff9a56"/></linearGradient></defs><circle cx="256" cy="256" r="220" fill="url(#spg)"/><path d="M215 180v152a44 44 0 1 1-24-39V204l112-28v112a44 44 0 1 1-24-39V150z" fill="#0e0e13" transform="translate(24 14) scale(.92)"/></svg>
  </div>
  <h1>Nada</h1>
  <p>Musik apa aja, kapan aja.</p>
  <div class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
</div>
<div id="app">
  <header class="top">
    <h1><span class="logo"><svg viewBox="0 0 512 512" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff4f6d"/><stop offset="1" stop-color="#ff9a56"/></linearGradient></defs><circle cx="256" cy="256" r="236" fill="url(#lg)"/><path d="M215 180v152a44 44 0 1 1-24-39V204l112-28v112a44 44 0 1 1-24-39V150z" fill="#0e0e13" transform="translate(24 14) scale(.92)"/></svg></span><span class="wm">Nada</span></h1>
    <div id="navbar" class="navbar" hidden></div>
    <form id="searchForm" role="search" autocomplete="off">
      <div class="searchrow">
        <div class="qwrap"><svg class="qi" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 5 5"/></svg><input id="q" type="search" enterkeyhint="search" autocomplete="off" aria-label="Cari lagu"
               placeholder="Cari lagu, artis, atau link"><button type="button" id="qClear" class="qclear" hidden aria-label="Hapus pencarian" tabindex="-1"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
        <button type="button" id="officialBtn" class="chip" aria-pressed="true" title="Cuma tampilkan musik resmi (tanpa reupload)">
          <svg viewBox="0 0 24 24"><path d="m5 12 4.5 4.5L19 7"/></svg>Resmi
        </button>
      </div>
      <div id="suggest" class="suggest" hidden></div>
    </form>
  </header>

  <main id="list" class="list" aria-live="polite"></main>

  <button id="mini" class="mini" hidden aria-label="Buka pemutar">
    <img id="miniArt" alt="">
    <span class="meta"><b id="miniTitle"></b><small id="miniArtist"></small></span>
    <span id="miniPlay" class="icon-btn" role="button" aria-label="Putar/Jeda"></span>
    <span id="miniNext" class="icon-btn" role="button" aria-label="Berikutnya"></span>
    <i id="miniBar"></i>
  </button>

  <nav class="tabs">
    <button data-tab="home" class="on"><svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"/></svg>Beranda</button>
    <button data-tab="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 5 5"/></svg>Cari</button>
    <button data-tab="library"><svg viewBox="0 0 24 24"><path d="M5 4v16M10 4v16M15.5 5.5l4 14"/></svg>Pustaka</button>
    <button id="tvToggle" aria-label="Mode TV"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/></svg>Mode TV</button>
  </nav>

  <section id="story" class="story" hidden role="dialog" aria-modal="true" aria-label="Bagikan ke Story">
    <div class="story-head">
      <button id="storyClose" class="icon-btn" aria-label="Tutup"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      <b>Bagikan ke Story</b><span class="story-sp"></span>
    </div>
    <div class="story-stage"><canvas id="storyCanvas" width="540" height="960" aria-label="Pratinjau story"></canvas><div class="story-load"><i></i><i></i><i></i></div></div>
    <div class="story-pick"><small>Pilih template</small><div id="storyTpls" class="story-tpls" role="group" aria-label="Template"></div></div>
    <div class="story-lenrow"><small>Durasi video</small><div id="storyLen" class="story-len" role="group" aria-label="Durasi video"><button type="button" data-s="10" aria-pressed="false">10 dtk</button><button type="button" data-s="20" aria-pressed="false">20 dtk</button><button type="button" data-s="30" aria-pressed="true">30 dtk</button></div></div>
    <div class="story-actions">
      <button id="storyShare" class="pill big" type="button" disabled><svg viewBox="0 0 24 24"><path d="M12 15V4M8 8l4-4 4 4M5 13v6h14v-6"/></svg><span id="storyShareTxt">Menyiapkan…</span></button>
      <button id="storySave" class="pill ghost big" type="button" hidden><svg viewBox="0 0 24 24"><path d="M12 4v11M8 11l4 4 4-4M5 19h14"/></svg><span>Simpan</span></button>
    </div>
    <div class="story-more"><button id="storyStill" type="button" hidden>Bagikan gambar diam</button><button id="storyLink" type="button">Salin link lagu</button></div>
    <p id="storyTip" class="story-tip"></p>
  </section>

  <section id="player" class="sheet idle" data-pview="video" aria-label="Pemutar">
    <div id="pbg" aria-hidden="true"><i></i></div>
    <div class="sheet-head">
      <button id="collapse" class="icon-btn" aria-label="Tutup pemutar"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
      <span>Sedang diputar</span>
      <button id="moreBtn" class="icon-btn more" aria-label="Menu lagu"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg></button>
    </div>
    <div class="pview" role="group" aria-label="Tampilan pemutar">
      <button id="pvVideo" type="button" aria-pressed="true">Video</button>
      <button id="pvLyrics" type="button" aria-pressed="false">Lirik</button>
      <button id="kBtn" class="kbtn" type="button" aria-label="Lirik layar penuh" title="Lirik layar penuh"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
    <div class="stage" id="stage">
      <div class="video"><div id="yt"></div></div>
      <button id="nextPeek" class="peek" type="button" hidden></button>
      <div id="lyrics" class="lyrics" aria-live="off" aria-label="Lirik lagu"></div>
    </div>
    <div class="info">
      <div class="meta"><h2 id="title">Belum ada yang diputar</h2><p id="artist">Cari lagu, terus tap buat muter</p></div>
      <button id="favBtn" class="icon-btn heart" aria-label="Suka"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></button>
    </div>
    <div class="seek">
      <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Posisi lagu">
      <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
    </div>
    <div class="controls">
      <button id="shuffle" class="icon-btn" aria-label="Acak"><svg viewBox="0 0 24 24"><path d="M3 7h3c5 0 6 10 11 10h4M3 17h3c1.5 0 2.6-.9 3.6-2.2M14.4 9.2C15.4 7.9 16.5 7 18 7h3M18 4l3 3-3 3M18 14l3 3-3 3"/></svg></button>
      <button id="prev" class="icon-btn" aria-label="Sebelumnya"></button>
      <button id="play" class="play-btn" aria-label="Putar/Jeda"></button>
      <button id="next" class="icon-btn" aria-label="Berikutnya"></button>
      <button id="repeat" class="icon-btn" aria-label="Ulangi"><svg viewBox="0 0 24 24"><path d="M17 3l3 3-3 3M4 11V9a3 3 0 0 1 3-3h13M7 21l-3-3 3-3M20 13v2a3 3 0 0 1-3 3H4"/></svg><em id="repeatOne">1</em></button>
    </div>
    <div class="extras" role="group" aria-label="Fitur tambahan">
      <button id="qBtn" class="xbtn" type="button" aria-label="Buka antrean"><svg viewBox="0 0 24 24"><path d="M4 6h12M4 11h12M4 16h7M17 14v6M14 17h6"/></svg><span>Antrean</span><em id="qCount" hidden>0</em></button>
      <button id="sleepBtn" class="xbtn" type="button" aria-label="Timer tidur"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg><span id="sleepTxt">Tidur</span></button>
      <button id="artBtn" class="xbtn" type="button" aria-label="Buka halaman artis"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c.6-3.6 3.5-5.5 7-5.5s6.4 1.9 7 5.5"/></svg><span>Artis</span></button>
    </div>
    <div id="upnext" class="upnext" aria-label="Berikutnya"></div>
  </section>

  <section id="karaoke" class="karaoke" hidden role="dialog" aria-modal="true" aria-label="Lirik layar penuh">
    <div class="k-bg" aria-hidden="true"><img id="kImg" alt=""></div><div class="k-tint" aria-hidden="true"></div>
    <div class="k-top">
      <button id="kClose" class="icon-btn" type="button" aria-label="Tutup layar penuh"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
      <div class="k-meta"><b id="kTitle"></b><small id="kArtist"></small></div>
      <button id="kSize" class="icon-btn ksz" type="button" aria-label="Ubah ukuran huruf">Aa</button>
    </div>
    <div id="kLines" class="k-lines" aria-live="off"></div>
    <div class="k-bot">
      <div class="k-prog" aria-hidden="true"><i id="kBar"></i></div>
      <div class="k-ctl"><button id="kPrev" class="icon-btn" type="button" aria-label="Sebelumnya"></button><button id="kPlay" class="play-btn" type="button" aria-label="Putar/Jeda"></button><button id="kNext" class="icon-btn" type="button" aria-label="Berikutnya"></button></div>
    </div>
  </section>

  <section id="queueSheet" class="qsheet" hidden role="dialog" aria-modal="true" aria-label="Antrean">
    <div class="q-card">
      <div class="q-grab" aria-hidden="true"></div>
      <div class="q-head"><div><b>Antrean</b><small id="qsSub"></small></div><button id="qsClear" class="link" type="button">Kosongkan</button><button id="qsClose" class="icon-btn" type="button" aria-label="Tutup antrean"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
      <div id="qsBody" class="q-body"></div>
    </div>
  </section>

  <div id="menu" class="menu" hidden>
    <div class="menu-card" role="dialog" aria-modal="true" aria-label="Menu lagu">
      <div id="menuHead" class="menu-head"><img id="menuArt" alt=""><div class="meta"><b id="menuTitle"></b><small id="menuSub"></small></div></div>
      <div id="menuBody"></div>
    </div>
  </div>

  <div id="tvHint" hidden><span><b>◀ ▲ ▼ ▶</b> Navigasi</span><span><b>OK</b> Putar</span><span><b>F / Kuning</b> Suka</span><span><b>M / Biru</b> Menu</span><span><b>Play/Pause</b> Jeda</span><span><b>Kembali</b> Menu utama</span></div>
  <div id="toast" role="status"></div>
</div>
<script>
/* splash: tampil sebentar setiap aplikasi dibuka, lalu pudar. */
(function () {
  var s = document.getElementById('splash'); if (!s) return;
  var t0 = Date.now(), done = false;
  function hide() {
    if (done) return; done = true;
    setTimeout(function () { s.classList.add('out'); setTimeout(function () { s.remove(); }, 550); }, Math.max(0, 1500 - (Date.now() - t0)));
  }
  if (document.readyState === 'complete') hide(); else addEventListener('load', hide);
  setTimeout(hide, 4500);
})();
</script>
