(function () {
  var s = document.getElementById('splash'); if (!s) return;
  var t0 = Date.now(), done = false, HV = '2026.11.03-2';
  /* penjaga: kalau halaman ini versi lama (masih tersimpan di cache), bersihkan cache lalu muat ulang sekali */
  try {
    fetch('/version.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) {
      if (!j || !j.v || j.v === HV || sessionStorage.getItem('nada.hv') === j.v) return;
      sessionStorage.setItem('nada.hv', j.v);
      var jobs = [];
      if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (x) { return x.unregister(); })); }));
      if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
      Promise.all(jobs).then(function () { location.reload(); });
    }).catch(function () {});
  } catch (e) {}
  function hide() {
    if (done) return; done = true;
    setTimeout(function () { s.classList.add('out'); setTimeout(function () { s.remove(); }, 550); }, Math.max(0, 2000 - (Date.now() - t0)));
  }
  if (document.readyState === 'complete') hide(); else addEventListener('load', hide);
  setTimeout(hide, 4500);
})();
